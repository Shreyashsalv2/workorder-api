# Local stack: the API on PostgreSQL 16.  `docker compose up --build`, then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: workorders
      POSTGRES_PASSWORD: workorders
      POSTGRES_DB: workorders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workorders"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://workorders:workorders@db:5432/workorders
      SEED_DEMO_DATA: "1"
      AUTO_CREATE_TABLES: "0"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
